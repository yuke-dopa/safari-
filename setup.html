<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>拡張機能の設定</title>
<style>
  /* Safariの中で、手順を上に、押すボタンの位置を下で指し示す一枚の画面 */
  :root {
    --bg: #f5f5f7; --card: #ffffff; --fg: #111111; --sub: #6b6b70; --line: #dcdce2;
    --accent: #2563eb; --ok: #16a34a; --ring: rgba(37, 99, 235, 0.35);
    --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f0f0f; --card: #1c1c1e; --fg: #ffffff; --sub: #9a9aa0; --line: #2c2c30; --accent: #4f8cff; --ok: #34c759; --ring: rgba(79, 140, 255, 0.4); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0f0f0f; --card: #1c1c1e; --fg: #ffffff; --sub: #9a9aa0; --line: #2c2c30; --accent: #4f8cff; --ok: #34c759; --ring: rgba(79, 140, 255, 0.4); color-scheme: dark; }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px; box-sizing: border-box;
  }
  .wrap { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--sub); }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 8px; height: 8px; border-radius: 4px; background: var(--line); }
  .dots i.on { background: var(--accent); width: 20px; }
  .card { background: var(--card); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .step { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
  h1 { margin: 0; font-size: 21px; line-height: 1.45; text-wrap: balance; }
  .card p { margin: 0; font-size: 14px; line-height: 1.7; color: var(--sub); }
  .key { display: inline-block; padding: 1px 8px; border-radius: 8px; background: var(--bg); color: var(--fg); font-weight: 700; border: 1px solid var(--line); }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 14px; font: 700 16px/1 var(--font); background: var(--accent); color: #fff; text-align: center; text-decoration: none; cursor: pointer; }
  .btn.sub { flex: 0 0 auto; background: transparent; color: var(--sub); padding-inline: 8px; }
  .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .note { font-size: 12px; color: var(--sub); line-height: 1.6; }
  .done h1 { color: var(--ok); }

  /* 下のアドレスバーのボタンを指す印。左からの位置は --x で変える */
  .pointer {
    --x: 31%;
    position: fixed; left: var(--x); bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
    transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px;
    pointer-events: none; z-index: 10;
  }
  .pointer .lab { background: var(--accent); color: #fff; font: 700 13px/1 var(--font); padding: 7px 10px; border-radius: 10px; white-space: nowrap; }
  .pointer .arrow { font-size: 30px; line-height: 1; color: var(--accent); font-weight: 900; animation: bob 1.1s ease-in-out infinite; }
  .pointer .dot { width: 46px; height: 46px; border-radius: 50%; border: 4px solid var(--accent); box-shadow: 0 0 0 8px var(--ring); animation: pulse 1.6s ease-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--ring); } 100% { box-shadow: 0 0 0 16px transparent; } }
  @media (prefers-reduced-motion: reduce) { .pointer .arrow, .pointer .dot { animation: none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="head"><span>おすすめ・ショート非表示の設定</span><span class="dots" id="dots"></span></div>
  <section class="card" id="card"></section>
  <p class="note" id="foot">この画面はSafariの中で開いています。アプリに戻らずに、上から順に進めてください。</p>
</main>
<div class="pointer" id="pointer" hidden><span class="lab" id="plab">ここを押す</span><span class="arrow">↓</span><span class="dot"></span></div>

<script>
(function () {
  "use strict";
  // 手順。ptr は下のアドレスバーで指す位置（左からの割合）。指さないときは null
  var STEPS = [
    { t: "下のアドレスバーの、左のボタンを押してください",
      p: "「<span class='key'>ぁあ</span>」や「<span class='key'>🧩</span>」の形のボタンです。押すと、下からメニューが出ます。",
      ptr: 31, lab: "ここを押す" },
    { t: "メニューの「機能拡張を管理」を押してください",
      p: "メニューが出たら、下のほうにある「<span class='key'>機能拡張を管理</span>」を探して押します。見つからないときは、メニューを上にスクロールしてください。",
      ptr: null },
    { t: "「おすすめ・ショート非表示」をオンにしてください",
      p: "一覧の「<span class='key'>おすすめ・ショート非表示</span>」のスイッチを押して緑にし、右上の「<span class='key'>完了</span>」を押します。",
      ptr: null },
    { t: "最後に、YouTubeで「許可」します",
      p: "下のボタンでYouTubeが開きます。開いたら、もう一度アドレスバーの左のボタン → 「<span class='key'>おすすめ・ショート非表示</span>」→「<span class='key'>常に許可</span>」を押してください。<br>おすすめが消えたら、設定は完了です。",
      ptr: null, go: true }
  ];
  var i = 0;
  var card = document.getElementById("card");
  var dots = document.getElementById("dots");
  var pointer = document.getElementById("pointer");
  var plab = document.getElementById("plab");

  // 待合室と同じしくみで、拡張機能がもう動いているか確かめる（動いていれば設定は済んでいる）
  var ready = false;
  window.addEventListener("message", function (e) {
    if (e.origin === "https://m.youtube.com" && e.data === "osh-ready" && !ready) { ready = true; render(); }
  });
  var f = document.createElement("iframe");
  f.setAttribute("aria-hidden", "true"); f.tabIndex = -1;
  f.style.cssText = "position:absolute;width:1px;height:1px;border:0;opacity:0;left:-10px;top:-10px;pointer-events:none";
  f.src = "https://m.youtube.com/robots.txt#osh-ping";
  document.body.appendChild(f);

  function render() {
    dots.innerHTML = "";
    if (ready) {
      pointer.hidden = true;
      card.className = "card done";
      card.innerHTML = "<div class='step'>完了</div><h1>✅ 設定できています</h1><p>SafariでYouTubeを開くと、おすすめとショートが出なくなります。</p>" +
        "<div class='row'><a class='btn' href='https://m.youtube.com/?noapp=1'>YouTubeを開く</a></div>";
      return;
    }
    for (var k = 0; k < STEPS.length; k++) { var d = document.createElement("i"); if (k === i) d.className = "on"; dots.appendChild(d); }
    var s = STEPS[i];
    card.className = "card";
    card.innerHTML = "<div class='step'>ステップ " + (i + 1) + " / " + STEPS.length + "</div><h1>" + s.t + "</h1><p>" + s.p + "</p>" +
      "<div class='row'>" + (i > 0 ? "<button class='btn sub' id='back' type='button'>‹ もどる</button>" : "") +
      (s.go ? "<a class='btn' href='https://m.youtube.com/?noapp=1'>YouTubeを開いて許可する</a>"
            : "<button class='btn' id='next' type='button'>できた ›</button>") + "</div>";
    if (s.ptr !== null) { pointer.style.setProperty("--x", s.ptr + "%"); plab.textContent = s.lab; pointer.hidden = false; }
    else pointer.hidden = true;
    var n = document.getElementById("next"); if (n) n.onclick = function () { i = Math.min(i + 1, STEPS.length - 1); render(); };
    var b = document.getElementById("back"); if (b) b.onclick = function () { i = Math.max(i - 1, 0); render(); };
  }
  render();
})();
</script>
</body>
</html>
