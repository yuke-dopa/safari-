<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>拡張機能がオンになっているか確認しています</title>
<style>
  /* 一枚の画面：まん中に、アプリのアイコン・進み具合の円・ひとこと。アプリと同じ配色 */
  :root {
    --bg: #f5f5f7;
    --card: #ffffff;
    --fg: #111111;
    --sub: #6b6b70;
    --track: #dcdce2;
    --accent: #2563eb;
    --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f0f0f; --card: #1c1c1e; --fg: #ffffff; --sub: #9a9aa0; --track: #2c2c30; --accent: #4f8cff; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0f0f0f; --card: #1c1c1e; --fg: #ffffff; --sub: #9a9aa0; --track: #2c2c30; --accent: #4f8cff; color-scheme: dark; }

  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font);
    display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px; box-sizing: border-box;
  }
  .wrap { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
  .app { display: flex; align-items: center; gap: 10px; }
  .app img { width: 36px; height: 36px; border-radius: 9px; }
  .app span { font-size: 15px; font-weight: 600; letter-spacing: 0.01em; }

  .ring { position: relative; width: 148px; height: 148px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
  .ring .track { fill: none; stroke: var(--track); stroke-width: 10; }
  .ring .bar { fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round; }
  .ring .pct {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .ring .pct small { font-size: 15px; font-weight: 600; margin-left: 2px; color: var(--sub); }

  h1 { margin: 0; font-size: 19px; font-weight: 700; text-wrap: balance; }
  h1 .nw { display: inline-block; white-space: nowrap; }
  .wait { margin: -6px 0 0; font-size: 15px; color: #8a8a8f; }
  .wait .nw { display: inline-block; white-space: nowrap; }


  .help { width: 100%; background: var(--card); border-radius: 14px; padding: 16px; box-sizing: border-box; text-align: left; display: flex; flex-direction: column; gap: 10px; }
  .help b { font-size: 15px; }
  .help p { margin: 0; font-size: 13px; line-height: 1.7; color: var(--sub); white-space: pre-line; }
  [hidden] { display: none !important; }
  .btn { width: 100%; box-sizing: border-box; display: block; text-align: center; padding: 12px; border-radius: 12px; background: var(--accent); color: #fff; font-weight: 700; font-size: 15px; text-decoration: none; }
  .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .btn.sub { background: transparent; color: var(--accent); padding: 8px; }
  .ring.stop .bar { stroke: var(--sub); }
  .quick { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--card); color: var(--sub); font-size: 13px; text-decoration: none; }
  .quick b { color: var(--accent); white-space: nowrap; }
  .lnk { display: block; margin: 14px auto 0; padding: 8px 12px; border: 0; background: none; color: var(--sub); font-family: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; }
  .probe { position: absolute; width: 1px; height: 1px; border: 0; opacity: 0; pointer-events: none; left: -10px; top: -10px; }
  body { margin: 0; }
</style>
</head>
<body>


<main class="wrap">
  <div class="app"><img id="icon" src="icon.png" alt=""><span id="appName">おすすめ・ショート非表示 for Y</span></div>

  <div class="ring" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="ring">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <circle class="track" cx="60" cy="60" r="50"></circle>
      <circle class="bar" id="bar" cx="60" cy="60" r="50"></circle>
    </svg>
    <div class="pct"><span id="pct">0</span><small>%</small></div>
  </div>

  <h1 id="title"><span class="nw">拡張機能がオンになっているか</span><span class="nw">確認しています</span></h1>
  <p id="wait" class="wait">数秒お待ちください</p>
  <!-- 設定へのボタンは、これ1つだけ。最初から出しておき、オフらしいと分かったら目立たせる -->
  <!-- アプリの設定画面を開く（アプリは「設定ができていない」と覚えて、次から最初に設定の画面を出す）
       待合室はアプリから開かれるので、アプリは入っている -->
  <a class="btn" id="setup" href="https://osusume-hide.github.io/open/setup">拡張機能を設定する</a>
  <!-- 準備に時間がかかっているとき：自分で選んでYouTubeへ進める（勝手には進まない。おすすめが見えてしまうため） -->
  <button type="button" class="lnk" id="goYt" hidden>このままYouTubeを開く</button>
  <!-- 設定できているか分からない人へ：言い切らずに、設定への出口だけ小さく先に見せる -->
  <a class="lnk" id="softSetup" href="https://osusume-hide.github.io/open/setup" hidden>設定がまだの方はこちら ›</a>
</main>

<script>
(function () {
  "use strict";
  var DEMO = false; // 見本：拡張機能の代わりに、数秒で「準備できた」にする
  var ja = (navigator.language || "ja").toLowerCase().indexOf("ja") === 0;
  if (!ja) {
    document.documentElement.lang = "en";
    document.getElementById("appName").textContent = "No Recs & Shorts";
    document.getElementById("title").textContent = "Checking the extension is on";
    document.getElementById("wait").textContent = "Just a few seconds";
    document.getElementById("setup").textContent = "Set up the extension";
    document.title = "Getting YouTube ready";
  } else {
    document.documentElement.lang = "ja";
  }

  // 行き先（アプリが ?to=/watch?v=... のように渡す）。YouTubeの中のページだけ
  var to = "/";
  try {
    var q = new URLSearchParams(location.search).get("to") || "/";
    if (q.charAt(0) === "/" && q.charAt(1) !== "/") to = q;
  } catch (e) { to = "/"; }
  // noapp を付けると、YouTube公式アプリが入っていても、アプリではなくSafariで開く（YouTubeの決まり）
  var dest = "https://m.youtube.com" + to + (to.indexOf("?") >= 0 ? "&" : "?") + "noapp=1";

  // 拡張機能が動き出したかを、見えない小さな枠（YouTubeの文字だけのページ）で確かめる。
  // Safariを開いた直後は拡張機能の準備が遅れることがあるので、0.8秒ごとに新しい枠で確かめ直す（準備ができたらすぐ分かる）
  var ready = false, firstLoadAt = 0, frameEl = null;
  window.addEventListener("message", function (e) {
    if (e.origin === "https://m.youtube.com" && e.data === "osh-ready") ready = true;
  });
  function probe() {
    if (ready || DEMO) return;
    if (frameEl) frameEl.remove();
    frameEl = document.createElement("iframe");
    frameEl.className = "probe";
    frameEl.setAttribute("aria-hidden", "true");
    frameEl.setAttribute("tabindex", "-1");
    frameEl.addEventListener("load", function () { if (!firstLoadAt) firstLoadAt = performance.now(); });
    frameEl.src = "https://m.youtube.com/robots.txt#osh-ping";
    document.body.appendChild(frameEl);
  }
  probe();
  var probeTimer = setInterval(function () { if (ready) clearInterval(probeTimer); else probe(); }, 300);
  // アプリが渡す「拡張機能が最後に動いてから何分たったか」。最近動いていれば、Safariの準備はできているはずなので、早めに案内を出す
  var seenMin = -1;
  try { var sm = new URLSearchParams(location.search).get("seen"); if (sm !== null && sm !== "") seenMin = Number(sm); } catch (e) { seenMin = -1; }
  // 2026-11-22：一度設定できた人（アプリが seen を渡す）は、Safariを開いた直後に拡張機能の準備が遅れても、
  // 「オフでは？」とあわてさせない。設定のボタンは最初は出さず、10秒待っても動かないときだけ、落ち着いた文で出す。
  // まだ設定していない人（seen なし）は、今までどおり早めに案内する
  var setUpUser = seenMin >= 0;
  // 2026-11-24：設定が最後まで済んでいない（YouTubeでの許可がまだ）とアプリが分かっているとき（ng=1）は、待たせずにすぐ案内を出す
  var notDone = false;
  try { notDone = new URLSearchParams(location.search).get("ng") === "1"; } catch (e) { notDone = false; }
  if (notDone) setUpUser = false;
  // 2026-11-24：アプリを入れ直した直後など、「設定できているか、まだ確かめていない」とき（chk=1）。
  // 設定できている人もいるので、2.5秒だけ待つ（2026-11-24：8秒は長いので短くした）。動けばそのままYouTubeへ、動かなければ案内を出す
  // アプリが「拡張機能はオン」と分かっているか（on=1。iOS 26.2以上だけ分かる）
  var knownOn = false;
  // 2026-11-25：on=1 でも、「オンか分からない人」と同じ見せ方にする（ユーザーの指示）。
  // スイッチがオンでも「YouTubeの許可」だけまだの人がいて、その人に15秒待たせたうえ「準備に時間がかかっています」と出していたため。
  // → 7割手前で止まる円・3秒で「設定がまだの方はこちら ›」・8秒で「拡張機能が動いていないかもしれません」と設定の案内
  // （アプリは今も on=1 を付けてくる。この値は使わない）
  var checkMode = false;
  try { checkMode = new URLSearchParams(location.search).get("chk") === "1"; } catch (e) { checkMode = false; }
  if (checkMode) { setUpUser = true; notDone = false; }
  var helpWait = notDone ? 0 : setUpUser ? 3000 : 1200; // 確かめるページが読み込まれてから、この時間返事がなければ案内を出す
  if (setUpUser) document.getElementById("setup").hidden = true;

  // 進み具合：準備ができるまでは、だんだんゆっくり9割に近づく。できたら100%まで進めて、YouTubeへ
  var bar = document.getElementById("bar");
  var pctEl = document.getElementById("pct");
  var ring = document.getElementById("ring");
  var C = 2 * Math.PI * 50;
  bar.style.strokeDasharray = C.toFixed(2);
  bar.style.strokeDashoffset = C.toFixed(2);
  var t0 = performance.now(), last = t0, shown = 0, done = false, helpShown = false, slowShown = false;
  var demoReadyAt = 3800; // 見本では3.8秒で準備できたことにする

  function frame(now) {
    var dt = Math.min(64, now - last); last = now;
    var el = now - t0;
    if (DEMO && el > demoReadyAt) ready = true;
    // 進み具合：途中でゆっくりにならないよう、10秒で99%まで、ずっと同じ速さで進む（準備ができたら、そこから100%へ）
    // 2026-11-25：進み具合の見せ方を分ける。
    //  ・スイッチがオンと分かっている人（on=1）：早めに進めるが、8割ほどで止める。動いた（設定が最後まで済んでいると確かめた）瞬間に100%でYouTubeへ。
    //    2026-11-25：前は3秒で99%まで進めていたが、iPadで「YouTubeの許可」だけまだの人が、99%まで進んでから止まり、設定できたと勘違いした。
    //    スイッチがオンでも、許可がまだのことがある。確かめられるまでは、終わりそうに見せない
    //  ・それ以外（設定できているか分からない人）：序盤から伸び悩ませ、約7割手前で止まりそうに見せる（このあと設定の案内が出ることを匆わせる）
    var target = ready ? 1 : helpShown ? shown : knownOn ? 0.82 * (1 - Math.exp(-el / 1100)) : 0.68 * (1 - Math.exp(-el / 700)); // 案内を出したら、それ以上は進めない
    shown = ready ? shown + (1 - shown) * Math.min(1, dt / 90) : target;
    if (ready && 1 - shown < 0.004) shown = 1;
    bar.style.strokeDashoffset = (C * (1 - shown)).toFixed(2);
    var n = Math.floor(shown * 100);
    pctEl.textContent = n;
    ring.setAttribute("aria-valuenow", n);

    // 確かめるページが読み込まれてから少し（最近動いていたなら1.2秒、それ以外は2.5秒）たっても返事がなければ、
    // 拡張機能がオフかもしれないので、すぐ案内を出す（読み込み自体が遅いときは、開いてから4秒で出す）。円は灰色にする
    // 2026-11-24：設定が最後まで済んでいる人（setUpUser）には、「動いていないかもしれません」は出さない（ユーザーの指示）。
    // Safariを開いた直後は拡張機能の準備が遅れるだけなので、返事を待ち続け、8秒たっても返事がなければ、そのままYouTubeへ進む
    var noAnswer = (!setUpUser && (notDone || (firstLoadAt ? now - firstLoadAt > helpWait : el > 2500))) || (checkMode && (firstLoadAt ? now - firstLoadAt > 2500 : el > 3500)); // 2026-11-24：確かめるときも長く待たせず、2.5秒で設定へ案内する
    // 2026-11-24：設定できている人でも、8秒たっても返事がないときは、勝手にYouTubeへは進まない
    // （入れ直した直後などは、拡張機能が動かないままYouTubeが開き、おすすめが見えてしまった）。
    // 「準備に時間がかかっています」と出して、設定のボタンと「このままYouTubeを開く」を出す。待ち続け、動けばそのままYouTubeへ
    // 2026-11-24：設定できている人（アプリが「最後まで設定できている」と分かっている人）には、すぐには案内を出さない（ちゃんとできているのに出ると混乱するため）。
    // 円を進めたまま「もう少しお待ちください…」で待ち、10秒たっても動かないときだけ案内を出す。設定が途中だと分かっている人は、アプリが ng=1 を付けるので、すぐ案内が出る
    // 2026-11-24：アプリがオンだと分かっている（iOS 26.2以上で on=1）ときだけ10秒待つ。分からない端末（古いiOS）は3秒で案内する
    // 設定できていると分かっている人（on=1）には、設定の案内は出さない（15秒たっても動かないときだけ、最後の逃げ道として出す）。分からない人は3秒で案内する
    // 2026-11-25：設定できているか分からない人に、早めに「動いていない」と言い切ると、実は設定できている人が混乱する。
    // 3秒では小さなリンク（設定がまだの方はこちら）だけを出し、8秒で初めて案内を出す
    if (setUpUser && !checkMode && !knownOn && !ready && !helpShown && el > 3000 && !DEMO) document.getElementById("softSetup").hidden = false;
    if (setUpUser && !checkMode && !ready && !helpShown && el > (knownOn ? 15000 : 8000) && !DEMO) {
      document.getElementById("softSetup").hidden = true;
      helpShown = true;
      ring.classList.add("stop");
      ring.hidden = true;
      // オンだと分かっている人：準備が遅れているだけなので、やわらかい文。分からない人：動いていない見込みが高いので、設定へ案内する文
      document.getElementById("title").textContent = knownOn
        ? (ja ? "準備に時間がかかっています" : "This is taking a while")
        : (ja ? "拡張機能が動いていないかもしれません" : "The extension may not be running");
      document.getElementById("wait").hidden = true;
      document.getElementById("setup").hidden = false;
    }
    // 設定できている人には、3秒たったら「もう少し」とだけ出す（ボタンは出さない）
    if (setUpUser && !ready && !helpShown && el > 1500 && !slowShown) {
      slowShown = true;
      document.getElementById("wait").textContent = ja ? "もう少しお待ちください…" : "Almost ready…";
    }
    if (!ready && !helpShown && noAnswer) {
      helpShown = true;
      ring.classList.add("stop");
      document.getElementById("title").textContent = setUpUser || notDone
        ? (ja ? "拡張機能が動いていないかもしれません" : "The extension may not be running")
        : (ja ? "拡張機能がオフになっていませんか？" : "Is the extension turned off?");
      document.getElementById("setup").hidden = false;
      document.getElementById("wait").hidden = true;
      ring.hidden = true; // 案内を出したら、％の円は消す（99％で止まって見えないように） // 案内を出したら「数秒お待ちください」は消す
    }
    // 案内を出したあとも待ち続ける（Safariを開いた直後は、拡張機能の準備が遅れることがある）。オンだと分かれば、そのままYouTubeへ
    if (ready) { ring.classList.remove("stop"); ring.hidden = false; document.getElementById("setup").hidden = true; document.getElementById("goYt").hidden = true; document.getElementById("softSetup").hidden = true; }
    // 準備ができたら、円の動きを待たずに、すぐYouTubeへ
    if (ready && !DEMO && shown < 1) {
      shown = 1;
      bar.style.strokeDashoffset = "0";
      pctEl.textContent = "100";
    }
    if (shown === 1 && !done) {
      done = true;
      setTimeout(function () {
        if (DEMO) { t0 = performance.now(); shown = 0; done = false; ready = false; requestAnimationFrame(frame); return; }
        location.replace(dest);
      }, DEMO ? 1400 : 60);
      if (!DEMO) return;
      return;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
